<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/><style>.t{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.line{stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}.note{fill:white;stroke:#cbd5e1;stroke-width:2}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker></defs>
  <text x="60" y="60" class="t h">One automation run — sequence</text>
  <text x="130" y="125" class="t b">User</text><text x="405" y="125" class="t b">Frontend</text><text x="680" y="125" class="t b">Backend</text><text x="945" y="125" class="t b">Google Sheet</text><text x="1210" y="125" class="t b">MoEngage</text>
  <line x1="165" y1="150" x2="165" y2="830" class="line"/><line x1="450" y1="150" x2="450" y2="830" class="line"/><line x1="725" y1="150" x2="725" y2="830" class="line"/><line x1="1000" y1="150" x2="1000" y2="830" class="line"/><line x1="1260" y1="150" x2="1260" y2="830" class="line"/>
  <path d="M165 190 L450 190" class="arr"/><text x="230" y="178" class="t s">connect sheet</text><path d="M450 230 L725 230" class="arr"/><path d="M725 270 L1000 270" class="arr"/><text x="785" y="258" class="t s">read A:AF</text><path d="M1000 310 L725 310" class="arr"/>
  <path d="M165 365 L450 365" class="arr"/><text x="230" y="353" class="t s">choose filters + Run</text><path d="M450 405 L725 405" class="arr"/><text x="495" y="393" class="t s">POST /jobs</text>
  <rect x="650" y="440" rx="12" width="510" height="55" class="note"/><text x="675" y="475" class="t s">Re-read live sheet, filter rows, then process sequentially</text>
  <path d="M725 535 L1260 535" class="arr"/><text x="835" y="523" class="t s">workspace → query filters → Apply</text><path d="M1260 575 L725 575" class="arr"/><text x="850" y="563" class="t s">daily cells → summed metric</text>
  <path d="M725 625 L1000 625" class="arr"/><text x="785" y="613" class="t s">write AA:AF</text><path d="M725 675 L450 675" class="arr"/><text x="520" y="663" class="t s">poll job result</text><path d="M450 715 L165 715" class="arr"/><text x="240" y="703" class="t s">live row status</text>
  <rect x="650" y="755" rx="12" width="610" height="65" class="note"/><text x="675" y="782" class="t s">Failure is isolated to one row; later rows continue.</text><text x="675" y="807" class="t s">Retry creates a new job containing only failed row numbers.</text>
</svg>
