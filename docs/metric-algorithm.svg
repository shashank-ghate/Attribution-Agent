<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/><style>.t{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb}.orange{fill:#fff7ed;stroke:#ea580c}.green{fill:#ecfdf5;stroke:#059669}.red{fill:#fef2f2;stroke:#dc2626}.arr{stroke:#52647c;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#52647c"/></marker></defs>
  <text x="65" y="62" class="t h">Per-campaign metric algorithm</text>
  <rect x="500" y="100" rx="20" width="400" height="90" class="box blue"/><text x="565" y="155" class="t b">Normalize channel, type and dates</text>
