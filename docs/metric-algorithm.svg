  <rect x="535" y="390" rx="20" width="330" height="115" class="box orange"/><text x="645" y="435" class="t b">Offline</text><text x="570" y="475" class="t s">Txn_Channel does not exist</text>
  <rect x="990" y="390" rx="20" width="330" height="115" class="box"/><text x="1090" y="435" class="t b">Overall</text><text x="1035" y="475" class="t s">run both branches</text>
  <rect x="190" y="600" rx="20" width="1020" height="100" class="box green"/><text x="290" y="643" class="t b">For each branch: query Unique users, then query Revenue aggregation</text><text x="320" y="675" class="t s">select Daily → ignore Average summary → sum daily AG Grid cells</text>
